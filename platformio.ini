; Backgammon-NN on ESP32 display boards.
;   e32r40t - 4.0" ESP32-32E display (lcdwiki E32R40T): play vs the net, COM4
; Build/flash:  ..\m5-llm\.venv\Scripts\pio.exe run -e e32r40t -t upload

[platformio]
default_envs = e32r40t

; 4.0" ESP32-32E display (lcdwiki E32R40T): classic ESP32, 4 MB flash, no PSRAM.
[env:e32r40t]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
upload_port = COM4
monitor_port = COM4
upload_speed = 921600
monitor_speed = 921600
build_flags = -O2
build_unflags = -Os
build_src_filter = +<common/> +<e32r40t/>
lib_deps = lovyan03/LovyanGFX
board_build.embed_files =
	data/net.bin
	data/movetests.bin
	data/fonts/sans16.vlw
	data/fonts/bold16.vlw
	data/fonts/sans21.vlw
	data/fonts/bold21.vlw

; Backgammon-NN on ESP32 touch-screen boards. One game (src/), one header per
; board (include/boards/, chosen by -DBOARD_xxx); the layout scales to the
; board's W x H. See the README, "Porting to another display".
;   e32r40t         - 4.0" ESP32-32E display, 480x320 (the reference board, COM4)
;   e32r40t_320x240 - the same board drawing the 320x240 layout in a corner (test)
;   cyd28           - 2.8" "Cheap Yellow Display" ESP32-2432S028R, 320x240 (untested)
; Build/flash:  ..\m5-llm\.venv\Scripts\pio.exe run -e e32r40t -t upload

[platformio]
default_envs = e32r40t

; Shared by every board: a classic 4 MB ESP32 with no PSRAM. Pinned to PlatformIO's
; espressif32 7.1.3 (arduino-esp32 2.0.17), which the releases are built with - the
; ws7 env overrides it with the ESP-IDF 5 platform it needs.
[env]
platform = platformio/espressif32@7.1.3
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
upload_speed = 921600
monitor_speed = 921600
build_unflags = -Os
build_src_filter = +<common/> +<game/>
lib_deps = lovyan03/LovyanGFX

[env:e32r40t]
upload_port = COM4
monitor_port = COM4
build_flags = -O2 -DBOARD_E32R40T
board_build.embed_files =
	data/net.bin
	data/movetests.bin
	data/fonts/sans16.vlw
	data/fonts/bold16.vlw
	data/fonts/sans21.vlw
	data/fonts/bold21.vlw

; Test of the 320x240 layout on the 4.0" board (drawn in its top-left corner).
[env:e32r40t_320x240]
upload_port = COM4
monitor_port = COM4
build_flags = -O2 -DBOARD_E32R40T -DLAYOUT_W=320 -DLAYOUT_H=240 -DFONT_PX_S=11 -DFONT_PX_L=14
board_build.embed_files =
	data/net.bin
	data/movetests.bin
	data/fonts/sans11.vlw
	data/fonts/bold11.vlw
	data/fonts/sans14.vlw
	data/fonts/bold14.vlw

; Waveshare ESP32-S3-Touch-LCD-7 (800x480 RGB, GT911 touch, 8 MB OPI PSRAM, 16 MB
; flash). Flash through its "USB" socket; if the port is missing, hold BOOT while
; plugging in (then power-cycle after flashing). arduino-esp32 3.x / ESP-IDF 5
; (pioarduino) for the RGB driver's bounce buffers - see include/boards/ws7.h.
[env:ws7]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
upload_port = COM5
monitor_port = COM5
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_flags = -O2 -DBOARD_WS7 -DBOARD_HAS_PSRAM -DARDUINO_USB_CDC_ON_BOOT=1
board_build.embed_files =
	data/net.bin
	data/movetests.bin
	data/fonts/sans24.vlw
	data/fonts/bold24.vlw
	data/fonts/sans32.vlw
	data/fonts/bold32.vlw

; 2.8" Cheap Yellow Display (ESP32-2432S028R) - untested on hardware.
[env:cyd28]
build_flags = -O2 -DBOARD_CYD28
board_build.embed_files =
	data/net.bin
	data/movetests.bin
	data/fonts/sans11.vlw
	data/fonts/bold11.vlw
	data/fonts/sans14.vlw
	data/fonts/bold14.vlw

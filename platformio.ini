; M5Stack CoreS3 backgammon experiments.
;   board   - 320x240 touch board display test
;   nnbench - live Backgammon-NN net on-device: PyTorch parity + timing
;             (data/*.bin from tools/export_net.py)
; Build/flash one:  ..\m5-llm\.venv\Scripts\pio.exe run -e nnbench -t upload

[platformio]
default_envs = board

[env]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_port = COM3
monitor_port = COM3
board_build.partitions = default_16MB.csv
build_flags =
	-O2
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -Os
lib_deps =
	m5stack/M5Unified

[env:board]
build_src_filter = +<board/>

[env:nnbench]
build_src_filter = +<common/> +<nnbench/>
board_build.embed_files =
	data/net.bin
	data/tests.bin

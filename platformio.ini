; Backgammon-NN on ESP32 touch-screen boards. One game (src/), one header per
; board (include/boards/, chosen by -DBOARD_xxx); the layout scales to the
; board's W x H. See the README, "Porting to another display".
;   e32r40t         - 4.0" ESP32-32E display, 480x320 (the reference board, COM4)
;   e32r40t_320x240 - the same board drawing the 320x240 layout in a corner (test)
;   cyd28           - 2.8" "Cheap Yellow Display" ESP32-2432S028R, 320x240 (untested)
; Build/flash:  ..\m5-llm\.venv\Scripts\pio.exe run -e e32r40t -t upload

[platformio]
default_envs = e32r40t

; Shared by every board: a classic 4 MB ESP32 with no PSRAM.
[env]
platform = espressif32
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
upload_speed = 921600
monitor_speed = 921600
build_unflags = -Os
build_src_filter = +<common/> +<game/>
lib_deps = lovyan03/LovyanGFX

[env:e32r40t]
upload_port = COM4
monitor_port = COM4
build_flags = -O2 -DBOARD_E32R40T
board_build.embed_files =
	data/net.bin
	data/movetests.bin
	data/fonts/sans16.vlw
	data/fonts/bold16.vlw
	data/fonts/sans21.vlw
	data/fonts/bold21.vlw

; Test of the 320x240 layout on the 4.0" board (drawn in its top-left corner).
[env:e32r40t_320x240]
upload_port = COM4
monitor_port = COM4
build_flags = -O2 -DBOARD_E32R40T -DLAYOUT_W=320 -DLAYOUT_H=240 -DFONT_PX_S=11 -DFONT_PX_L=14
board_build.embed_files =
	data/net.bin
	data/movetests.bin
	data/fonts/sans11.vlw
	data/fonts/bold11.vlw
	data/fonts/sans14.vlw
	data/fonts/bold14.vlw

; 2.8" Cheap Yellow Display (ESP32-2432S028R) - untested on hardware.
[env:cyd28]
build_flags = -O2 -DBOARD_CYD28
board_build.embed_files =
	data/net.bin
	data/movetests.bin
	data/fonts/sans11.vlw
	data/fonts/bold11.vlw
	data/fonts/sans14.vlw
	data/fonts/bold14.vlw

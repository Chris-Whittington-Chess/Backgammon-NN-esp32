; M5Stack CoreS3 backgammon experiments.
;   board   - 320x240 touch board display test
;   e32r40t - same board on the 4.0" ESP32-32E display (480x320, COM4)
;   nnbench - live Backgammon-NN net on-device: PyTorch parity + timing
;             (data/*.bin from tools/export_net.py)
; Build/flash one:  ..\m5-llm\.venv\Scripts\pio.exe run -e nnbench -t upload

[platformio]
default_envs = board

[env]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
upload_port = COM3
monitor_port = COM3
board_build.partitions = default_16MB.csv
build_flags =
	-O2
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
build_unflags = -Os
lib_deps =
	m5stack/M5Unified

[env:board]
build_src_filter = +<board/>

[env:nnbench]
build_src_filter = +<common/> +<nnbench/>
board_build.embed_files =
	data/net.bin
	data/tests.bin

; 4.0" ESP32-32E display (lcdwiki E32R40T): classic ESP32, 4 MB flash, no PSRAM.
[env:e32r40t]
board = esp32dev
board_build.partitions = huge_app.csv
upload_port = COM4
monitor_port = COM4
upload_speed = 921600
monitor_speed = 921600
build_flags = -O2
build_src_filter = +<e32r40t/>
lib_deps = lovyan03/LovyanGFX